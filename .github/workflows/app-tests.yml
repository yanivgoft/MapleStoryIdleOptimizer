name: App tests

# Engine golden tests (plain Python, no Excel), API tests and web tests/build.  The engine + API job is the same one-command runner agents use locally (tests/run_all.py).
# The engine goldens are generated with Python 3.11 and PYTHONHASHSEED=0 (3.12+ changes sum() rounding; the
# verify scripts have set-order float sums) so CI pins both.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  engine-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Engine goldens (all golden jobs) + API tests
        run: python tests/run_all.py --only golden --only api -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
