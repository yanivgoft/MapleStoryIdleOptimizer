<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* apply the saved theme (Light / Dark; absent = Auto) before first paint; keep in sync with src/lib/theme.ts */
      (function () {
        try {
          var t = localStorage.getItem("msi.theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
            document.documentElement.style.colorScheme = t;
          }
        } catch (e) {}
      })();
    </script>
    <title>MapleStory Idle DPS Calculator</title>
    <meta name="description" content="Free DPS calculator for MapleStory Idle RPG: enter the stats from your preset page and compare skills, companions, artifacts, cubes and equipment for your class." />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151b" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MapleStory Idle DPS Calculator" />
    <meta property="og:description" content="Enter the stats from your preset page and see your DPS, plus what to upgrade next: stat values, artifacts, companions, cubes and equipment." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
